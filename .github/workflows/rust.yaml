on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

name: rust

permissions: read-all

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # extendr links against libR
      - uses: r-lib/actions/setup-r@v2

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src/rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --lib

      # The vendored crates must match Cargo.lock, or offline (CRAN) builds fail
      - name: Check that vendor.tar.xz matches Cargo.lock
        run: |
          tar xf vendor.tar.xz
          mkdir -p .cargo && cp vendor-config.toml .cargo/config.toml
          cargo metadata --offline --format-version 1 > /dev/null
          rm -rf vendor .cargo
