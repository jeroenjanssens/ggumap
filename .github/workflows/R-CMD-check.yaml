# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main]
    # Files that are not part of the package (all in .Rbuildignore): changing
    # only these cannot affect the check, so do not spend runners on it.
    paths-ignore:
      - 'PLAN.md'
      - 'CRAN-SUBMISSION'
      - 'cran-comments.md'
      - 'CODE_OF_CONDUCT.md'
      - 'bench/**'
      - 'dev/**'
      - 'vignettes/articles/**'
      - '_pkgdown.yml'
      - 'justfile'
      - '.github/workflows/rhub.yaml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'PLAN.md'
      - 'CRAN-SUBMISSION'
      - 'cran-comments.md'
      - 'CODE_OF_CONDUCT.md'
      - 'bench/**'
      - 'dev/**'
      - 'vignettes/articles/**'
      - '_pkgdown.yml'
      - 'justfile'
      - '.github/workflows/rhub.yaml'
  workflow_dispatch:

name: R CMD check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      # R on Windows links with the GNU toolchain from Rtools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'Windows' && 'x86_64-pc-windows-gnu' || '' }}

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      # The installation log is not shown when the check passes; keep it, to
      # see what the build actually did (cargo/rustc versions, CRAN flags).
      - name: Upload the installation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-log-${{ matrix.config.os }}-${{ matrix.config.r }}
          path: check/*.Rcheck/00install.out
          if-no-files-found: warn

  # Windows as on CRAN/win-builder: the Rust version CRAN's Windows machines
  # use (installed with rustup and pinned, 1.92 at the time of writing; not
  # the newest), with the GNU host, and plain R CMD build/check without
  # NOT_CRAN, so the package is built exactly as from the CRAN tarball.
  windows-cran-rust:
    name: windows (release, CRAN's Rust 1.92)
    runs-on: windows-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # As on CRAN: the GNU host toolchain (build scripts are linked with
      # Rtools' gcc, like the package), not the runner's default MSVC host.
      - name: Install CRAN's Rust (1.92, GNU host)
        shell: bash
        run: |
          rustup toolchain install 1.92.0-x86_64-pc-windows-gnu --profile minimal
          rustup default 1.92.0-x86_64-pc-windows-gnu
          rustc -vV

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Show the Rust toolchain R finds
        shell: Rscript {0}
        run: |
          print(Sys.which(c("cargo", "rustc")))
          system("cargo --version")
          system("rustc --version")

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: R CMD build and check, as on CRAN
        shell: bash
        run: |
          unset NOT_CRAN
          export _R_CHECK_LIMIT_CORES_=TRUE
          R CMD build --no-manual .
          R CMD check --as-cran --no-manual ggumap_*.tar.gz || true
          echo "::group::Build steps from 00install.out"
          grep -E "Using (cargo|rustc)|Building for CRAN|if \[ \"|Finished|ERROR|error" ggumap.Rcheck/00install.out || true
          echo "::endgroup::"
          tail -n 25 ggumap.Rcheck/00check.log
          if grep -qE "^Status: .*(ERROR|WARNING)" ggumap.Rcheck/00check.log; then exit 1; fi

      - name: Upload the check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-log-windows-cran-rust
          path: |
            ggumap.Rcheck/00install.out
            ggumap.Rcheck/00check.log
          if-no-files-found: warn

  # Install with the minimum supported Rust version (SystemRequirements in
  # DESCRIPTION), offline from the vendored crates, as on CRAN.
  msrv:
    name: rustc 1.90 (offline)
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.90

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'

      - name: Build and install offline
        run: |
          rustc --version
          R CMD build --no-build-vignettes --no-manual .
          CARGO_NET_OFFLINE=true R CMD INSTALL ggumap_*.tar.gz
          Rscript -e 'library(ggumap); print(head(umap_embed(mtcars, seed = 1, n_threads = 1)))'
